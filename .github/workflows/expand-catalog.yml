name: Expandir Catalogo_S

on:
  push:
    branches: [main]
    paths:
      - '.github/catalog-trigger.txt'

permissions:
  contents: write

jobs:
  expandir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir e validar pacote
        run: |
          cat .github/catalog-parts/part*.b64 > catalog.b64
          base64 --decode catalog.b64 > Catalogo_S-repo.zip
          unzip -t Catalogo_S-repo.zip

      - name: Extrair catálogo completo
        run: |
          unzip -o Catalogo_S-repo.zip -d .
          rm -f Catalogo_S-repo.zip catalog.b64
          rm -rf .github/catalog-parts
          rm -f .github/catalog-trigger.txt
          rm -f .github/workflows/expand-catalog.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Publicar arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Sincroniza Catalogo_S completo v2.2"
            git push origin main
          fi
