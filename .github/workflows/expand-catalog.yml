name: Expandir Catalogo_S

on:
  push:
    branches: [main]
    paths:
      - 'Catalogo_S-repo.zip'

permissions:
  contents: write

jobs:
  expandir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair catálogo completo
        run: |
          unzip -o Catalogo_S-repo.zip -d .
          rm Catalogo_S-repo.zip

      - name: Publicar arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Expande Catalogo_S v2.2 completo"
            git push origin main
          fi
