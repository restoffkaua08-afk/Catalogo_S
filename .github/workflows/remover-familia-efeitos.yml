name: Remover família de efeitos

on:
  push:
    paths:
      - 'tools/remover-familia-efeitos.py'
      - '.github/workflows/remover-familia-efeitos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove família Axx e atualiza contratos
        run: python tools/remover-familia-efeitos.py

      - name: Valida remoção antes do commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -d efeitos
          test ! -f dados/efeitos.json
          test ! -f dados/efeitos.js
          test ! -f dados/efeitos-arquivados.json
          python - <<'PY'
          import json
          from pathlib import Path
          cats=json.loads(Path('dados/categorias.json').read_text(encoding='utf-8'))
          reg=json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))
          assert cats['quantidade']==12
          assert all(c['slug']!='fundos-e-telas' for c in cats['categorias'])
          assert len(reg['modelos'])==21
          assert all(not mid.startswith('A') for mid in reg['modelos'])
          print('Remoção estrutural validada: 12 categorias e 21 modelos.')
          PY

      - name: Publica limpeza definitiva
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/remover-familia-efeitos.py .github/workflows/remover-familia-efeitos.yml
          git add -A
          git commit -m "Remove categoria Fundos e telas e toda a família Axx"
          git push
