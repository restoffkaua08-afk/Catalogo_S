name: Teste do instalador Catálogo S

on:
  push:
    paths:
      - 'instalador/**'
      - 'frontend/LG01-Login-Lateral-com-Transicao-de-Cadastro/**'
      - 'backend/DB01-Banco-do-LG01/**'
      - '.github/workflows/teste-instalador.yml'
  workflow_dispatch:

jobs:
  composicao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testa LG01 depois DB01
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJETO="$RUNNER_TEMP/projeto-lg-db"
          mkdir -p "$PROJETO"
          cd "$PROJETO"

          node "$ROOT/instalador/catalogo-s.mjs" add LG01
          test -f login.html
          test -f assets/js/catalogo-s.config.js
          grep -q 'data-catalogo-s-page="login"' login.html
          grep -q 'loginEndpoint:""' assets/js/catalogo-s.config.js
          node "$ROOT/instalador/catalogo-s.mjs" doctor

          node "$ROOT/instalador/catalogo-s.mjs" add DB01 --no-deps
          test -f database/schema.sql
          test -f lib/catalogo-s-db.js
          test -f api/auth/login.js
          test -f api/auth/cadastro.js
          grep -q "loginEndpoint:\"/api/auth/login\"" assets/js/catalogo-s.config.js
          grep -q "cadastroEndpoint:\"/api/auth/cadastro\"" assets/js/catalogo-s.config.js
          grep -q '"estadoIntegracao": "conectado"' .catalogo-s/projeto.json
          node "$ROOT/instalador/catalogo-s.mjs" doctor

      - name: Testa DB01 antes LG01
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJETO="$RUNNER_TEMP/projeto-db-lg"
          mkdir -p "$PROJETO"
          cd "$PROJETO"

          node "$ROOT/instalador/catalogo-s.mjs" add DB01 --no-deps
          test -f database/schema.sql
          grep -q '"estadoIntegracao": "aguardando-LG01"' .catalogo-s/projeto.json

          node "$ROOT/instalador/catalogo-s.mjs" add LG01
          test -f login.html
          test -f assets/js/catalogo-s.config.js
          grep -q "loginEndpoint:\"/api/auth/login\"" assets/js/catalogo-s.config.js
          grep -q '"estadoIntegracao": "conectado"' .catalogo-s/projeto.json
          node "$ROOT/instalador/catalogo-s.mjs" doctor
