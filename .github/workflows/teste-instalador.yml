name: Teste integral do Catálogo S
# Gate de estabilidade para o catálogo regenerado.

on:
  push:
    paths:
      - 'instalador/**'
      - 'frontend/**'
      - 'backend/DB01-Banco-do-LG01/**'
      - 'dados/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/teste-instalador.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: catalogo
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcatalogo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida catálogo, contratos e demos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, html, re

          registry=json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))
          models=registry['modelos']
          categories=json.loads(Path('dados/categorias.json').read_text(encoding='utf-8'))
          assert registry.get('instalacaoPublica')=='powershell-autocontido'
          assert len(models)==35, f'esperados 35 modelos, encontrados {len(models)}'
          assert categories.get('quantidade')==len(categories.get('categorias',[]))

          items=[i for c in categories['categorias'] for i in c.get('itens',[])]
          ids=[i['id'] for i in items]
          assert len(ids)==len(set(ids)), 'ID duplicado no catálogo'
          assert set(ids)==set(models), 'catálogo e registro técnico divergem'
          js=Path('dados/categorias.js').read_text(encoding='utf-8')
          forbidden=['npx ','github.com/','api.github.com','raw.githubusercontent.com','git clone','invoke-webrequest','invoke-restmethod']

          for item in items:
              assert Path(item['caminho']).exists(), f"{item['id']}: caminho ausente"
              assert item['id'] in js and item['caminho'] in js, f"{item['id']}: categorias.js divergente"

          for mid,model in models.items():
              script_path=Path(model['instaladorPublico'])
              assert script_path.exists(), f'{mid}: instalar.ps1 ausente'
              script=script_path.read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in script.lower(), f'{mid}: dependência pública proibida: {token}'
              demo=script_path.parent/'index.html'
              text=demo.read_text(encoding='utf-8')
              assert 'id="copy"' in text and 'Copiar código PowerShell' in text, f'{mid}: cópia incompleta'
              match=re.search(r'<pre id="command">([\s\S]*?)</pre>',text)
              assert match and html.unescape(match.group(1))==script, f'{mid}: demo e instalar.ps1 divergem'
              assert 'scrolling="no"' in text, f'{mid}: preview com scroll aninhado'
              assert 'catalogo-preview-stability' in text and 'catalogo-preview-stability-script' in text
              if model['tipo']=='frontend':
                  template=Path(model['template']); txt=template.with_suffix('.txt')
                  assert template.exists() and txt.exists(), f'{mid}: bloco-pronto incompleto'
                  assert template.read_text(encoding='utf-8')==txt.read_text(encoding='utf-8'), f'{mid}: HTML/TXT divergentes'
              if mid.startswith('SOB'):
                  assert model.get('modo')=='pagina' and model.get('papel')=='sobre'
                  assert model.get('target')=='sobre.html' and model.get('rotulo')=='Sobre'
              if mid.startswith('F'):
                  assert model.get('modo')=='rodape' and model.get('slot')=='RODAPE'

          login_ids={'LG01','LG02','LG03','LG04','LG05'}
          db=models['DB01']
          assert set(db.get('interfacesCompativeis',[]))==login_ids
          for mid in login_ids:
              assert models[mid].get('backendCompativel')=='DB01'
              assert models[mid].get('contrato')==db.get('contrato')=='auth-email-senha-v1'
          print('35 modelos: catálogo, contratos, demos e códigos sincronizados.')
          PY

      - name: Executa todos os instaladores isoladamente
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python - <<'PY' > "$RUNNER_TEMP/modelos.txt"
          from pathlib import Path
          import json
          for m in json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))['modelos'].values():
              print('|'.join([m['id'],m['modo'],m.get('target',''),m.get('template',''),m['instaladorPublico']]))
          PY
          while IFS='|' read -r id mode target template script; do
            projeto="$RUNNER_TEMP/publico-${id,,}"
            rm -rf "$projeto"; mkdir -p "$projeto"
            (cd "$projeto" && pwsh -NoProfile -File "$ROOT/$script")
            case "$mode" in
              pagina)
                test -f "$projeto/$target"
                grep -qi '<html' "$projeto/$target"
                grep -qi '<body' "$projeto/$target"
                ;;
              componente)
                arquivo="$(find "$projeto/components/catalogo-s" -maxdepth 1 -type f -name "${id,,}-*.html" | head -n1)"
                test -n "$arquivo"
                grep -q "data-catalogo-s-model=\"$id\"" "$projeto/index.html"
                ;;
              rodape)
                test -f "$projeto/components/catalogo-s/rodape/ativo.html"
                grep -q "data-catalogo-s-model=\"$id\"" "$projeto/index.html"
                ;;
              banco)
                test -f "$projeto/database/schema.sql"
                test -f "$projeto/api/auth/login.js"
                test -f "$projeto/api/auth/cadastro.js"
                ;;
            esac
          done < "$RUNNER_TEMP/modelos.txt"

      - name: Testa substituição canônica e preservação
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          P="$RUNNER_TEMP/composicao"; rm -rf "$P"; mkdir -p "$P"; cd "$P"
          pwsh -NoProfile -File "$ROOT/frontend/I01-Tela-Inicial-Lateral-com-Foto-Emergindo-no-Degrade/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/F01-Rodape-Institucional-Solido/instalar.ps1"
          grep -q 'data-catalogo-s-model="F01"' index.html
          pwsh -NoProfile -File "$ROOT/frontend/I02-Tela-Inicial-com-Imagem-Cobertura-Total/instalar.ps1"
          grep -q 'data-catalogo-s-model="F01"' index.html

          pwsh -NoProfile -File "$ROOT/frontend/SOB01-Sobre-Split-Fotografico/instalar.ps1"
          grep -q 'data-catalogo-s-model="SOB01"' sobre.html
          pwsh -NoProfile -File "$ROOT/frontend/SOB02-Sobre-Editorial-com-Texto-Justificado/instalar.ps1"
          grep -q 'data-catalogo-s-model="SOB02"' sobre.html
          ! grep -q 'data-catalogo-s-model="SOB01"' sobre.html
          find .catalogo-s/backups -type f -name '*sobre.html.bak' | grep -q .

      - name: Confirma pós-processamento idempotente
        shell: bash
        run: |
          set -euo pipefail
          python tools/postprocess_powershell_installers.py
          git diff --exit-code -- frontend backend/DB01-Banco-do-LG01

      - name: Instala Chromium e executa smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/catalogo-http.log" 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python tests/browser_smoke.py

      - name: Testa DB01 com MySQL real
        shell: bash
        env:
          DATABASE_URL: mysql://root:catalogo@127.0.0.1:3306/catalogo_login_lg01
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          P="$RUNNER_TEMP/db01-real"; rm -rf "$P"; mkdir -p "$P"; cd "$P"
          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"
          npm install --no-audit --no-fund mysql2 bcryptjs
          cp "$ROOT/tests/db01_integration.mjs" ./db01_integration.mjs
          node db01_integration.mjs
