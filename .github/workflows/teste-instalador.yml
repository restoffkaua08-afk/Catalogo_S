name: Teste integral do Catálogo S
# A CI valida o mesmo PowerShell autocontido exibido ao usuário.

on:
  push:
    paths:
      - 'instalador/**'
      - 'frontend/**'
      - 'backend/DB01-Banco-do-LG01/**'
      - 'dados/categorias.*'
      - 'package.json'
      - '.github/workflows/teste-instalador.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida demonstrações e instaladores públicos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, html, re

          registry=json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))
          models=registry['modelos']
          assert registry.get('instalacaoPublica')=='powershell-autocontido'
          assert models, 'nenhum modelo registrado'

          forbidden=[
              'npx ', 'github.com/', 'api.github.com', 'raw.githubusercontent.com',
              'git clone', 'invoke-webrequest', 'invoke-restmethod'
          ]

          checked=0
          for mid,model in models.items():
              script_path=Path(model['instaladorPublico'])
              assert script_path.exists(), f'{mid}: instalar.ps1 ausente'
              script=script_path.read_text(encoding='utf-8')
              lower=script.lower()
              for token in forbidden:
                  assert token not in lower, f'{mid}: dependência pública proibida encontrada: {token}'

              demo=script_path.parent/'index.html'
              assert demo.exists(), f'{mid}: demonstração ausente'
              text=demo.read_text(encoding='utf-8')
              assert 'id="copy"' in text, f'{mid}: sem botão copiar'
              assert 'Copiar código PowerShell' in text, f'{mid}: botão incorreto'
              match=re.search(r'<pre id="command">([\s\S]*?)</pre>',text)
              assert match, f'{mid}: sem bloco PowerShell'
              visible=html.unescape(match.group(1))
              assert visible==script, f'{mid}: bloco exibido diverge de instalar.ps1'
              checked+=1

          print(f'{checked} modelos com bloco PowerShell autocontido validados.')
          PY

      - name: Executa cada instalador PowerShell isoladamente
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python - <<'PY' > "$RUNNER_TEMP/modelos.txt"
          from pathlib import Path
          import json
          data=json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))['modelos']
          for m in data.values():
              print('|'.join([m['id'],m['modo'],m.get('target',''),m['instaladorPublico']]))
          PY

          while IFS='|' read -r id mode target script; do
            projeto="$RUNNER_TEMP/publico-${id,,}"
            rm -rf "$projeto"
            mkdir -p "$projeto"
            (
              cd "$projeto"
              pwsh -NoProfile -File "$ROOT/$script"
            )

            case "$mode" in
              pagina)
                test -n "$target"
                test -f "$projeto/$target"
                ;;
              componente)
                test -f "$projeto/index.html"
                find "$projeto/components/catalogo-s" -maxdepth 1 -type f -name "${id,,}-*.html" | grep -q .
                grep -q "data-catalogo-s-model=\"$id\"" "$projeto/index.html"
                ;;
              banco)
                test -f "$projeto/database/schema.sql"
                test -f "$projeto/api/auth/login.js"
                test -f "$projeto/api/auth/cadastro.js"
                test -f "$projeto/lib/catalogo-s-db.js"
                ;;
            esac
          done < "$RUNNER_TEMP/modelos.txt"

      - name: Testa composição só com scripts copiados
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJETO="$RUNNER_TEMP/site-powershell"
          rm -rf "$PROJETO"
          mkdir -p "$PROJETO"
          cd "$PROJETO"

          check() {
            local label="$1"
            shift
            echo "[CHECK] $label"
            if ! "$@"; then
              echo "[FALHA] $label"
              exit 1
            fi
            echo "[OK] $label"
          }

          pwsh -NoProfile -File "$ROOT/frontend/I01-Tela-Inicial-Lateral-com-Foto-Emergindo-no-Degrade/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/C01-Carrossel-de-Destaques/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/E01-Secao-de-Navegacao-Visual/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/P01-Barra-de-Pesquisa-Minimalista-em-Linha/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/L01-Listagem-MR-em-Grade-com-Filtro-Compacto/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/LG01-Login-Lateral-com-Transicao-de-Cadastro/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"

          check 'C01 presente no index' grep -q 'data-catalogo-s-model="C01"' index.html
          check 'E01 presente no index' grep -q 'data-catalogo-s-model="E01"' index.html
          check 'P01 presente no index' grep -q 'data-catalogo-s-model="P01"' index.html
          check 'produtos.html criado' test -f produtos.html
          check 'login.html criado' test -f login.html
          check 'database/schema.sql criado' test -f database/schema.sql
          check 'endpoint de login conectado' grep -q "loginEndpoint:'/api/auth/login'" assets/js/catalogo-s.config.js

          pwsh -NoProfile -File "$ROOT/frontend/I02-Tela-Inicial-com-Imagem-Cobertura-Total/instalar.ps1"
          check 'C01 preservado após I02' grep -q 'data-catalogo-s-model="C01"' index.html
          check 'E01 preservado após I02' grep -q 'data-catalogo-s-model="E01"' index.html
          check 'P01 preservado após I02' grep -q 'data-catalogo-s-model="P01"' index.html

      - name: Testa DB01 antes do LG01 sem GitHub
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJETO="$RUNNER_TEMP/db-primeiro-powershell"
          rm -rf "$PROJETO"
          mkdir -p "$PROJETO"
          cd "$PROJETO"

          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/LG01-Login-Lateral-com-Transicao-de-Cadastro/instalar.ps1"
          grep -q "loginEndpoint:'/api/auth/login'" assets/js/catalogo-s.config.js
          grep -q "cadastroEndpoint:'/api/auth/cadastro'" assets/js/catalogo-s.config.js
