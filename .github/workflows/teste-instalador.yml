name: Teste integral do Catálogo S

on:
  push:
    paths:
      - 'instalador/**'
      - 'frontend/**'
      - 'backend/DB01-Banco-do-LG01/**'
      - 'dados/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/teste-instalador.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: catalogo
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcatalogo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida contrato, catálogo, demos e códigos copiáveis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, html, re

          registry=json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))
          models=registry['modelos']
          categories=json.loads(Path('dados/categorias.json').read_text(encoding='utf-8'))

          assert registry.get('instalacaoPublica')=='powershell-autocontido'
          assert len(models)==21, f'esperados 21 modelos, encontrados {len(models)}'
          assert categories.get('quantidade')==len(categories.get('categorias',[])), 'quantidade de categorias divergente'

          slugs=[c['slug'] for c in categories['categorias']]
          assert len(slugs)==len(set(slugs)), 'slug de categoria duplicado'
          items=[i for c in categories['categorias'] for i in c.get('itens',[])]
          ids=[i['id'] for i in items]
          assert len(ids)==len(set(ids)), 'ID duplicado no catálogo'
          assert set(ids)==set(models), 'catálogo e registro de modelos divergem'

          js=Path('dados/categorias.js').read_text(encoding='utf-8')
          forbidden=['npx ','github.com/','api.github.com','raw.githubusercontent.com','git clone','invoke-webrequest','invoke-restmethod']

          for item in items:
              assert Path(item['caminho']).exists(), f"{item['id']}: caminho ausente: {item['caminho']}"
              assert item['id'] in js and item['caminho'] in js, f"{item['id']}: categorias.js fora de sincronia"

          for mid,model in models.items():
              script_path=Path(model['instaladorPublico'])
              script=script_path.read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in script.lower(), f'{mid}: dependência pública proibida: {token}'

              demo=script_path.parent/'index.html'
              text=demo.read_text(encoding='utf-8')
              assert 'id="copy"' in text and 'Copiar código PowerShell' in text, f'{mid}: interface de cópia incompleta'
              match=re.search(r'<pre id="command">([\s\S]*?)</pre>',text)
              assert match and html.unescape(match.group(1))==script, f'{mid}: PowerShell exibido diverge do instalar.ps1'

              iframe=re.search(r'<iframe[^>]+src="([^"]+)"',text,re.I)
              assert iframe and (demo.parent/iframe.group(1)).exists(), f'{mid}: preview ausente'
              assert 'scrolling="no"' in text, f'{mid}: preview permite scroll interno'
              assert 'catalogo-preview-stability' in text, f'{mid}: estabilização do preview ausente'
              assert 'catalogo-preview-stability-script' in text, f'{mid}: sincronização de altura do preview ausente'

              if model['tipo']=='frontend':
                  template=Path(model['template'])
                  txt=template.with_suffix('.txt')
                  assert template.exists() and txt.exists(), f'{mid}: bloco-pronto incompleto'
                  assert template.read_text(encoding='utf-8')==txt.read_text(encoding='utf-8'), f'{mid}: HTML/TXT divergentes'

              if model.get('modo')=='componente':
                  assert 'O componente é salvo em um documento isolado' in script, f'{mid}: sandbox do componente ausente'
                  assert 'scrolling=`"no`"' in script, f'{mid}: host ainda gera iframe com scroll próprio'

          schema=Path('backend/DB01-Banco-do-LG01/schema.sql').read_text(encoding='utf-8')
          bloco=Path('backend/DB01-Banco-do-LG01/bloco-pronto.sql').read_text(encoding='utf-8')
          installer=Path('backend/DB01-Banco-do-LG01/instalar.ps1').read_text(encoding='utf-8')
          assert schema==bloco, 'DB01: schema.sql e bloco-pronto.sql divergentes'
          for route in ['/api/auth/login','/api/auth/cadastro']:
              assert route in schema and route in installer, f'DB01: rota atual ausente: {route}'
          for route in ["'/api/login'","'/api/cadastro'"]:
              assert route not in schema and route not in installer, f'DB01: rota obsoleta presente: {route}'

          assert 'COLOQUE_AQUI_A_URL_DA_IMAGEM' not in Path('frontend/E03-Secao-de-Galeria-Sobreposta/bloco-pronto.html').read_text(encoding='utf-8')
          print('21 modelos: contrato, metadados, previews, scroll e códigos sincronizados.')
          PY

      - name: Confirma que o pós-processamento é idempotente
        shell: bash
        run: |
          set -euo pipefail
          python tools/postprocess_powershell_installers.py
          git diff --exit-code -- frontend backend/DB01-Banco-do-LG01

      - name: Executa cada instalador PowerShell isoladamente
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python - <<'PY' > "$RUNNER_TEMP/modelos.txt"
          from pathlib import Path
          import json
          for m in json.loads(Path('instalador/modelos.json').read_text(encoding='utf-8'))['modelos'].values():
              print('|'.join([m['id'],m['modo'],m.get('target',''),m.get('template',''),m['instaladorPublico']]))
          PY

          while IFS='|' read -r id mode target template script; do
            projeto="$RUNNER_TEMP/publico-${id,,}"
            rm -rf "$projeto"
            mkdir -p "$projeto"
            (cd "$projeto" && pwsh -NoProfile -File "$ROOT/$script")

            case "$mode" in
              pagina)
                test -f "$projeto/$target"
                grep -qi '<html' "$projeto/$target"
                grep -qi '<body' "$projeto/$target"
                ;;
              componente)
                arquivo="$(find "$projeto/components/catalogo-s" -maxdepth 1 -type f -name "${id,,}-*.html" | head -n1)"
                test -n "$arquivo"
                grep -q "data-catalogo-s-model=\"$id\"" "$projeto/index.html"
                grep -q 'scrolling="no"' "$projeto/index.html"
                python - "$arquivo" "$ROOT/$template" <<'PY'
          from pathlib import Path
          import sys
          installed=Path(sys.argv[1]).read_text(encoding='utf-8')
          source=Path(sys.argv[2]).read_text(encoding='utf-8').strip()
          assert '<!doctype html>' in installed.lower(), 'componente instalado sem documento sandbox'
          assert 'html,body{margin:0' in installed, 'sandbox sem reset de margem'
          assert source in installed, 'fragmento original não foi preservado dentro do sandbox'
          PY
                ;;
              banco)
                test -f "$projeto/database/schema.sql"
                test -f "$projeto/api/auth/login.js"
                test -f "$projeto/api/auth/cadastro.js"
                test -f "$projeto/lib/catalogo-s-db.js"
                grep -q "loginEndpoint:'/api/auth/login'" "$projeto/assets/js/catalogo-s.config.js"
                grep -q "cadastroEndpoint:'/api/auth/cadastro'" "$projeto/assets/js/catalogo-s.config.js"
                ;;
            esac
          done < "$RUNNER_TEMP/modelos.txt"

      - name: Testa composição e preservação entre modelos
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          P="$RUNNER_TEMP/site-powershell"
          rm -rf "$P"
          mkdir -p "$P"
          cd "$P"

          pwsh -NoProfile -File "$ROOT/frontend/I01-Tela-Inicial-Lateral-com-Foto-Emergindo-no-Degrade/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/C01-Carrossel-de-Destaques/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/E01-Secao-de-Navegacao-Visual/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/P01-Barra-de-Pesquisa-Minimalista-em-Linha/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/L01-Listagem-MR-em-Grade-com-Filtro-Compacto/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/LG01-Login-Lateral-com-Transicao-de-Cadastro/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"

          for id in C01 E01 P01; do
            grep -q "data-catalogo-s-model=\"$id\"" index.html
          done
          test "$(grep -o 'scrolling="no"' index.html | wc -l)" -ge 3
          test -f produtos.html
          test -f login.html
          test -f database/schema.sql
          grep -q "loginEndpoint:'/api/auth/login'" assets/js/catalogo-s.config.js
          grep -q "cadastroEndpoint:'/api/auth/cadastro'" assets/js/catalogo-s.config.js

          pwsh -NoProfile -File "$ROOT/frontend/I02-Tela-Inicial-com-Imagem-Cobertura-Total/instalar.ps1"
          for id in C01 E01 P01; do
            grep -q "data-catalogo-s-model=\"$id\"" index.html
          done
          test "$(grep -o 'scrolling="no"' index.html | wc -l)" -ge 3

      - name: Testa DB01 antes do LG01
        shell: bash
        env:
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          P="$RUNNER_TEMP/db-primeiro"
          rm -rf "$P"
          mkdir -p "$P"
          cd "$P"

          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"
          pwsh -NoProfile -File "$ROOT/frontend/LG01-Login-Lateral-com-Transicao-de-Cadastro/instalar.ps1"
          grep -q "loginEndpoint:'/api/auth/login'" assets/js/catalogo-s.config.js
          grep -q "cadastroEndpoint:'/api/auth/cadastro'" assets/js/catalogo-s.config.js

      - name: Instala Chromium para smoke tests
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Testa catálogo e todas as demonstrações em Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/catalogo-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python tests/browser_smoke.py

      - name: Testa DB01 com MySQL real
        shell: bash
        env:
          DATABASE_URL: mysql://root:catalogo@127.0.0.1:3306/catalogo_login_lg01
          CATALOGO_S_SKIP_DEPS: '1'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          P="$RUNNER_TEMP/db01-real"
          rm -rf "$P"
          mkdir -p "$P"
          cd "$P"

          pwsh -NoProfile -File "$ROOT/backend/DB01-Banco-do-LG01/instalar.ps1"
          npm install --no-audit --no-fund mysql2 bcryptjs
          cp "$ROOT/tests/db01_integration.mjs" ./db01_integration.mjs
          node db01_integration.mjs
