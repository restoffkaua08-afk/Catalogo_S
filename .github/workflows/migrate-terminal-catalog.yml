name: Geração PowerShell autocontida

on:
  push:
    paths:
      - 'tools/migrate_terminal_catalog.py'
      - 'tools/add_footer_models.py'
      - 'tools/postprocess_powershell_installers.py'
      - 'frontend/**/bloco-pronto.html'
      - 'frontend/**/bloco-pronto.txt'
      - 'backend/DB01-Banco-do-LG01/schema.sql'
      - 'backend/DB01-Banco-do-LG01/bloco-pronto.sql'
      - 'instalador/templates/DB01/**'
      - '.github/workflows/migrate-terminal-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gera modelos e instaladores
        run: |
          python tools/migrate_terminal_catalog.py
          python tools/add_footer_models.py
          python tools/postprocess_powershell_installers.py

      - name: Publica arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend/DB01-Banco-do-LG01 dados instalador/modelos.json instalador/README.md README.md documentacao .github/workflows/teste-instalador.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Gera modelos de rodapé F01 a F05"
            git push
          fi

      - name: Dispara gate sobre o estado final
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Commits feitos pelo GITHUB_TOKEN não iniciam outros workflows de push.
          # Por isso o gate é disparado explicitamente após a regeneração/publicação.
          gh workflow run teste-instalador.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          echo "Gate de estabilidade solicitado para $GITHUB_REF_NAME."

# trigger: geração dos rodapés F01-F05
