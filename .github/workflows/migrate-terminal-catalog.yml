name: Migração integral para terminal

on:
  push:
    paths:
      - 'tools/migrate_terminal_catalog.py'
      - '.github/workflows/migrate-terminal-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplica migração
        run: python tools/migrate_terminal_catalog.py

      - name: Publica arquivos migrados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend efeitos backend/DB01-Banco-do-LG01 dados instalador/modelos.json instalador/README.md documentacao/COMO-ADICIONAR-UM-MODELO.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "Migra todos os modelos e demonstrações para instalação por terminal"
          git push
