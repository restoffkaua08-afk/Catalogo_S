name: Geração PowerShell autocontida
# SOBxx pipeline integrado em 2026-09-03
# Gate de 35 modelos estabilizado.

on:
  push:
    paths:
      - 'tools/migrate_terminal_catalog.py'
      - 'tools/add_footer_models.py'
      - 'tools/add_about_models.py'
      - 'tools/postprocess_powershell_installers.py'
      - 'frontend/**/bloco-pronto.html'
      - 'frontend/**/bloco-pronto.txt'
      - 'backend/DB01-Banco-do-LG01/schema.sql'
      - 'backend/DB01-Banco-do-LG01/bloco-pronto.sql'
      - 'instalador/templates/DB01/**'
      - '.github/workflows/migrate-terminal-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Torna o gerador Fxx independente do gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/add_footer_models.py')
          text=p.read_text(encoding='utf-8')
          pattern=r"def patch_tests\(\):\n[\s\S]*?\n\ndef generate_footers\(\):"
          replacement="def patch_tests():\n    # O gate é mantido em .github/workflows/teste-instalador.yml.\n    return\n\n\ndef generate_footers():"
          updated,count=re.subn(pattern,replacement,text,count=1)
          if count:
              p.write_text(updated,encoding='utf-8')
              print('Responsabilidade de testes removida do gerador Fxx.')
          else:
              print('Gerador Fxx já não edita o gate.')
          PY

      - name: Gera modelos e instaladores
        run: |
          python tools/migrate_terminal_catalog.py
          python tools/add_footer_models.py
          python tools/add_about_models.py
          python tools/postprocess_powershell_installers.py

      - name: Publica arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend/DB01-Banco-do-LG01 dados instalador/modelos.json instalador/README.md README.md documentacao tests/browser_smoke.py tools/add_footer_models.py
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Gera catálogo PowerShell com Fxx e SOBxx"
            git push
          fi

      - name: Dispara gate sobre o estado final
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run teste-instalador.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          echo "Gate de estabilidade solicitado para $GITHUB_REF_NAME."
