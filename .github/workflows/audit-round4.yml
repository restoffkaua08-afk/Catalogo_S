name: Audit Round 4
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_round4_generator.py'
      - '.github/workflows/audit-round4.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate refined glass demos
        run: python tools/audit_round4_generator.py
      - name: Validate generated files
        run: |
          set -e
          for p in A01-Glassmorphism-Vidro-Fosco A02-Vidro-Escuro A03-Vidro-Liquido A06-Efeito-Acrilico; do
            test -f "efeitos/$p/index.html"
            test -f "efeitos/$p/bloco-pronto.html"
            test -f "efeitos/$p/bloco-pronto.txt"
          done
          ! grep -q 'BACKGROUND MATERIAL' efeitos/A01-Glassmorphism-Vidro-Fosco/bloco-pronto.html
          ! grep -q 'BACKGROUND MATERIAL' efeitos/A02-Vidro-Escuro/bloco-pronto.html
          ! grep -q 'BACKGROUND MATERIAL' efeitos/A03-Vidro-Liquido/bloco-pronto.html
          ! grep -q 'BACKGROUND MATERIAL' efeitos/A06-Efeito-Acrilico/bloco-pronto.html
      - name: Commit refined demos and clean temporary files
        run: |
          rm -f tools/audit_round4_generator.py .github/workflows/audit-round4.yml
          git config user.name 'Catalogo S Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refina demos A01 A02 A03 A06'
          git push
