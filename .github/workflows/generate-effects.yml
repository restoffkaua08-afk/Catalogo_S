name: Gerar Biblioteca de Efeitos

on:
  push:
    branches: [main]
    paths:
      - '.github/effect-generator/trigger.txt'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruir gerador
        run: |
          cat .github/effect-generator/part*.txt > /tmp/generator.txt
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          b=base64.b64decode(Path('/tmp/generator.txt').read_text())
          Path('/tmp/generate_effects.py').write_bytes(lzma.decompress(b))
          PY
          python -m py_compile /tmp/generate_effects.py

      - name: Gerar e validar
        run: |
          python /tmp/generate_effects.py /tmp/catalogo-effects
          test "$(find /tmp/catalogo-effects/efeitos -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 144
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/catalogo-effects')
          d=json.loads((root/'dados/efeitos.json').read_text(encoding='utf-8'))
          assert len(d['itens'])==144 and len({x['id'] for x in d['itens']})==144
          assert d['itens'][0]['id']=='A01' and d['itens'][-1]['id']=='A144'
          for x in d['itens']:
              t=(root/x['caminho']).read_text(encoding='utf-8')
              for q in ('#393c41','#08090c','circle c1','circle c2','circle c3','code-section','Copiar código'):
                  assert q in t,(x['id'],q)
          print('144/144 validados')
          PY

      - name: Um commit por efeito
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY' > /tmp/list.tsv
          import json
          d=json.load(open('/tmp/catalogo-effects/dados/efeitos.json',encoding='utf-8'))
          for x in d['itens']: print(f"{x['id']}\t{x['nome']}\t{x['caminho']}")
          PY
          n=0
          while IFS=$'\t' read -r id nome caminho; do
            mkdir -p "$(dirname "$caminho")"
            cp "/tmp/catalogo-effects/$caminho" "$caminho"
            git add "$caminho"
            git commit -m "$id — $nome"
            n=$((n+1))
            if [ $((n % 24)) -eq 0 ]; then git push origin main; fi
          done < /tmp/list.tsv
          test "$n" -eq 144
          git push origin main

      - name: Integrar catálogo e documentação
        run: |
          mkdir -p dados documentacao efeitos
          cp /tmp/catalogo-effects/index.html index.html
          cp /tmp/catalogo-effects/dados/efeitos.json dados/efeitos.json
          cp /tmp/catalogo-effects/dados/efeitos.js dados/efeitos.js
          cp /tmp/catalogo-effects/documentacao/BIBLIOTECA-DE-EFEITOS.md documentacao/BIBLIOTECA-DE-EFEITOS.md
          cp /tmp/catalogo-effects/efeitos/README.md efeitos/README.md
          git add index.html dados/efeitos.json dados/efeitos.js documentacao/BIBLIOTECA-DE-EFEITOS.md efeitos/README.md
          git commit -m "Integra biblioteca de 144 efeitos ao Catálogo S"
          git push origin main

      - name: Auditoria final e limpeza
        run: |
          test "$(find efeitos -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 144
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dados/efeitos.json').read_text(encoding='utf-8'))
          assert len(d['itens'])==144
          assert all(Path(x['caminho']).exists() for x in d['itens'])
          print('Auditoria final OK')
          PY
          git rm -r .github/effect-generator .github/workflows/generate-effects.yml
          git commit -m "Remove infraestrutura temporária da geração de efeitos"
          git push origin main
