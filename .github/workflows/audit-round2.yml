name: Audit Round 2
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_round2_generator.py'
      - '.github/workflows/audit-round2.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate refined demos
        run: python tools/audit_round2_generator.py
      - name: Validate generated files
        run: |
          set -e
          test -f frontend/L03-Listagem-Horizontal-Comparativa/index.html
          test -f efeitos/A91-Mesh-Gradient/index.html
          test -f efeitos/A92-Gradiente-Animado/index.html
          test -f efeitos/A93-Aurora-Gradient/index.html
          test -f efeitos/A127-Starfield-3D/index.html
          ! grep -q 'Design que cria atmosfera' efeitos/A91-Mesh-Gradient/bloco-pronto.html
          ! grep -q 'Design que cria atmosfera' efeitos/A92-Gradiente-Animado/bloco-pronto.html
          ! grep -q 'display:none}#efeito-a127' efeitos/A127-Starfield-3D/bloco-pronto.html
      - name: Commit refined demos and clean temporary files
        run: |
          rm -f tools/audit_round2_generator.py tools/refine_payload_I02.b64 .github/workflows/audit-round2.yml
          git config user.name 'Catalogo S Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Refina L03 e fundos A91 A92 A93 A127'
          git push
