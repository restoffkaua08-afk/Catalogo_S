<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo S</title><style>:root{--bg:#08090c;--surface:#111318;--surface2:#171a20;--ink:#f7f3e9;--muted:#98948c;--gold:#d1ad73;--line:rgba(255,255,255,.11)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.topbar{position:fixed;z-index:50;top:0;left:0;right:0;height:72px;padding:0 clamp(18px,4vw,52px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(8,9,12,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{font:500 20px Georgia,serif}.context{justify-self:end;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.home-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.2s}.home-btn:hover,.home-btn.active{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}.home-btn svg{width:20px;height:20px}.app{padding-top:72px}.home-view{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:50px 24px 70px}.home-head{text-align:center;margin-bottom:42px}.kicker{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.home-head h1,.category-head h1{font:500 clamp(42px,6vw,76px) Georgia,serif;line-height:.95;margin:12px 0}.home-head p,.category-head p{color:var(--muted);line-height:1.7;margin:0}.category-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1120px}.category-card{width:clamp(150px,15vw,184px);aspect-ratio:1;border-radius:50%;padding:20px;border:1px solid var(--line);background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.07),rgba(255,255,255,.018) 48%,transparent 70%),var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;transition:.25s}.category-card:hover{transform:translateY(-7px);border-color:rgba(209,173,115,.55);box-shadow:0 24px 55px rgba(0,0,0,.30)}.category-icon{width:42px;height:42px;display:grid;place-items:center;color:var(--gold)}.category-icon svg{width:32px;height:32px}.category-title{font:500 18px/1.05 Georgia,serif}.category-count{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.category-view{min-height:calc(100svh - 72px);padding:64px clamp(20px,5vw,70px) 80px}.category-head{max-width:900px;margin:0 auto 38px}.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:1200px;margin:0 auto}.demo-card{min-height:150px;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;gap:20px;transition:.24s}.demo-card:hover{transform:translateY(-4px);border-color:rgba(209,173,115,.50);background:var(--surface2);box-shadow:0 24px 55px rgba(0,0,0,.25)}.demo-id{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.16em}.demo-name{font:500 23px/1.1 Georgia,serif}.demo-arrow{align-self:flex-end;color:#858179;transition:.2s}.demo-card:hover .demo-arrow{color:var(--gold);transform:translateX(3px)}@media(max-width:650px){.brand{font-size:16px}.context{font-size:8px}.home-view{justify-content:flex-start;padding-top:42px}.category-grid{gap:14px}.category-card{width:clamp(138px,42vw,170px)}.category-view{padding-top:40px}}</style></head><body><header class="topbar"><div class="brand">Catálogo S</div><button class="home-btn" id="homeBtn" aria-label="Voltar ao início"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 10.5 12 3l8.5 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6.5h5V21"></path></svg></button><div class="context" id="context">Categorias</div></header><main class="app" id="app"></main><script src="dados/categorias.js"></script><script>const data=window.CATALOGO_CATEGORIAS||{categorias:[]},app=document.getElementById('app'),homeBtn=document.getElementById('homeBtn'),context=document.getElementById('context');const ICONS={screen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',carousel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M3.5 8.5v7M20.5 8.5v7"/></svg>',homehero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18V6h18v12H3Z"/><path d="M7 14l3-3 2 2 3-4 3 5"/></svg>',grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',background:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M4.5 14c3-3.5 5.5-4 8-1s5 2.5 7-.5"/></svg>',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3 2.1 5.2L20 10l-4.5 3.6L16 20l-4-2.8L8 20l.5-6.4L4 10l5.9-1.8L12 3Z"/></svg>',shadow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="4" width="12" height="12" rx="2"/><path d="M8 19h9a3 3 0 0 0 3-3V8"/></svg>',lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M12 3v5M9 6l3-3 3 3"/></svg>'};function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function currentSlug(){const m=location.hash.match(/^#categoria=([^&]+)/);if(m)return decodeURIComponent(m[1]);const ret=sessionStorage.getItem('catalogo:return');if(ret){history.replaceState(null,'','#categoria='+encodeURIComponent(ret));return ret}return null}function goHome(){sessionStorage.removeItem('catalogo:return');sessionStorage.removeItem('catalogo:scroll');history.pushState(null,'',location.pathname+location.search);render()}function openCategory(slug){history.pushState(null,'','#categoria='+encodeURIComponent(slug));render()}function saveReturn(slug){sessionStorage.setItem('catalogo:return',slug);sessionStorage.setItem('catalogo:scroll',String(scrollY||0))}function renderHome(){context.textContent='Categorias';homeBtn.classList.add('active');app.innerHTML='<section class="home-view"><div class="home-head"><span class="kicker">Biblioteca visual</span><h1>Escolha uma categoria.</h1><p>Entre direto no tipo de componente que você quer explorar.</p></div><div class="category-grid">'+data.categorias.map(c=>'<button class="category-card" data-category="'+esc(c.slug)+'"><span class="category-icon">'+(ICONS[c.icone]||ICONS.screen)+'</span><span class="category-title">'+esc(c.titulo)+'</span><span class="category-count">'+c.itens.length+' modelos</span></button>').join('')+'</div></section>';app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>openCategory(b.dataset.category));scrollTo(0,0)}function renderCategory(slug){const c=data.categorias.find(x=>x.slug===slug);if(!c){goHome();return}context.textContent=c.titulo;homeBtn.classList.remove('active');app.innerHTML='<section class="category-view"><header class="category-head"><span class="kicker">Categoria</span><h1>'+esc(c.titulo)+'</h1><p>'+esc(c.descricao||'')+'</p></header><div class="demo-grid">'+c.itens.map(i=>'<a class="demo-card" href="'+esc(i.caminho)+'" data-demo><span class="demo-id">'+esc(i.id)+'</span><span class="demo-name">'+esc(i.nome)+'</span><span class="demo-arrow">→</span></a>').join('')+'</div></section>';app.querySelectorAll('[data-demo]').forEach(a=>a.onclick=()=>saveReturn(slug));const ret=sessionStorage.getItem('catalogo:return'),y=Number(sessionStorage.getItem('catalogo:scroll')||0);if(ret===slug){requestAnimationFrame(()=>requestAnimationFrame(()=>scrollTo(0,y)));sessionStorage.removeItem('catalogo:return');sessionStorage.removeItem('catalogo:scroll')}else scrollTo(0,0)}function render(){const slug=currentSlug();slug?renderCategory(slug):renderHome()}homeBtn.onclick=goHome;addEventListener('popstate',render);addEventListener('hashchange',render);render();</script></body></html>
