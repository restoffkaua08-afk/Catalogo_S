<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Catálogo S</title>
<style>
:root{--bg:#050608;--ink:#f7f3e9;--muted:#9e9a92;--gold:#d1ad73;--line:rgba(255,255,255,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100svh;overflow:hidden}.scene{position:relative;min-height:100svh;display:grid;place-items:center;padding:24px;isolation:isolate;background:radial-gradient(circle at 50% 120%,rgba(209,173,115,.12),transparent 38%),linear-gradient(180deg,#07080a,#030405)}.grid{position:absolute;inset:0;z-index:-5;background-image:linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at center,#000 28%,transparent 82%)}.beam{position:absolute;z-index:-4;width:min(540px,70vw);height:150%;left:50%;top:-25%;transform:translateX(-50%) rotate(9deg);background:linear-gradient(90deg,transparent,rgba(209,173,115,.035),rgba(255,255,255,.045),rgba(209,173,115,.035),transparent);filter:blur(12px)}.orb{position:absolute;z-index:-3;border-radius:50%;border:1px solid rgba(209,173,115,.16);box-shadow:0 0 100px rgba(209,173,115,.05),inset 0 0 80px rgba(255,255,255,.025)}.o1{width:min(720px,82vw);aspect-ratio:1;left:-26%;top:-34%}.o2{width:min(560px,70vw);aspect-ratio:1;right:-22%;bottom:-30%}.glow{position:absolute;z-index:-2;width:330px;height:330px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(209,173,115,.18),transparent 68%);filter:blur(45px)}.card{width:min(430px,100%);padding:42px 34px;border:1px solid rgba(255,255,255,.17);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035));backdrop-filter:blur(22px) saturate(1.18);-webkit-backdrop-filter:blur(22px) saturate(1.18);box-shadow:0 34px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.12);text-align:center}.card h1{margin:0 0 12px;font:500 42px/1 Georgia,serif}.card p{margin:0 auto 28px;max-width:310px;color:var(--muted);font-size:13px;line-height:1.65}.button{height:56px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:15px;background:linear-gradient(135deg,#f2e8d5,#d1ad73);color:#090a0c;font-weight:800;font-size:14px;box-shadow:0 16px 34px rgba(209,173,115,.14);transition:transform .18s ease,box-shadow .18s ease}.button:hover{transform:translateY(-2px);box-shadow:0 20px 42px rgba(209,173,115,.22)}@media(max-width:520px){.scene{padding:16px}.card{padding:36px 22px;border-radius:24px}.card h1{font-size:36px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="scene">
  <div class="grid"></div><div class="beam"></div><div class="orb o1"></div><div class="orb o2"></div><div class="glow"></div>
  <section class="card">
    <h1>Catálogo S</h1>
    <p>Biblioteca visual de modelos e componentes reutilizáveis.</p>
    <a class="button" href="/api/enter">Entrar no Catálogo</a>
  </section>
</main>
</body>
</html>
