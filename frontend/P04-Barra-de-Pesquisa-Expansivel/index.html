/p></div><button class="copy" id="copy">Copiar código</button></div><pre><code id="source"></code></pre></div></section><script>const root=document.getElementById('pesquisa-p04'),input=root.querySelector('input'),toggle=root.querySelector('.p04-toggle'),close=root.querySelector('.p04-close');const open=()=>{root.classList.add('open');toggle.setAttribute('aria-label','Pesquisa aberta');setTimeout(()=>input.focus(),180)};const shut=()=>{root.classList.remove('open');toggle.setAttribute('aria-label','Abrir pesquisa');input.blur()};toggle.addEventListener('click',()=>root.classList.contains('open')?input.focus():open());close.addEventListener('click',shut);const source=`<style>

<script>(()=>{const root=document.getElementById('pesquisa-p04'),input=root.querySelector('input'),toggle=root.querySelector('.p04-toggle'),close=root.querySelector('.p04-close');const open=()=>{root.classList.add('open');toggle.setAttribute('aria-label','Pesquisa aberta');setTimeout(()=>input.focus(),180)};const shut=()=>{root.classList.remove('open');toggle.setAttribute('aria-label','Abrir pesquisa');input.blur()};toggle.addEventListener('click',()=>root.classList.contains('open')?input.focus():open());close.addEventListener('click',shut);})();<\/script>`;document.getElementById('source').textContent=source;document.getElementById('copy').onclick=async e=>{try{await navigator.clipboard.writeText(source)}catch{const t=document.createElement('textarea');t.value=source;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}e.currentTarget.textContent='Copiado';setTimeout(()=>e.currentTarget.textContent='Copiar código',1200)};</script></body></html>
