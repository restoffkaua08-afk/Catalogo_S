<head>

<title>LG01 — Login Lateral com Transição de Cadastro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090c;color:#f7f3e9;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.demo-screen{height:100svh;min-height:100svh;background:#050607}.demo-screen iframe{display:block;width:100%;height:100%;border:0}.code-screen{min-height:100svh;background:#08090c;padding:clamp(36px,5vw,70px) clamp(22px,5vw,76px) 72px;border-top:1px solid rgba(255,255,255,.08)}.meta{max-width:1050px;margin:0 auto 34px}.id{color:#d4af73;font-size:12px;letter-spacing:.18em;font-weight:800}.meta h1{font:500 clamp(34px,5vw,60px) Georgia,serif;margin:8px 0 10px;line-height:1}.meta p{max-width:850px;margin:0;color:#aaa69e;line-height:1.7;font-size:16px}.pair{margin-top:14px;color:#d4af73;font-size:12px}.code-wrap{max-width:1320px;margin:0 auto}.code-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}.code-head h2{margin:0;font:500 30px Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:#171b22;color:#f7f3e9;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none}.btn:hover{border-color:#d4af73}textarea{width:100%;min-height:520px;background:#090b0f;color:#ece8dd;border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:18px;font:13px/1.6 Consolas,Monaco,monospace;resize:vertical}.catalog-back-float{position:fixed;z-index:99999;left:16px;top:16px;width:46px;height:46px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(8,9,12,.58);color:#f7f3e9;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(14px);box-shadow:0 14px 32px rgba(0,0,0,.25);transition:.2s}.catalog-back-float:hover{background:#d1ad73;color:#08090c;border-color:#d1ad73;transform:translateX(-2px)}.catalog-back-float svg{width:19px;height:19px}@media(max-width:760px){.code-screen{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<button class="catalog-back-float" type="button" aria-label="Voltar para Login" onclick="location.href='../../index.html#categoria=login'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></button>
<main>
<section class="demo-screen"><iframe src="bloco-pronto.html" title="Demonstração LG01"></iframe></section>
<section class="code-screen">
  <div class="meta"><div class="id">LG01 · CANDIDATO</div><h1>Login Lateral com Transição de Cadastro</h1><p>Tela independente com painel preto e fotografia lateral. Ao criar uma conta, os dois lados trocam de posição e o formulário de cadastro surge com animação.</p><div class="pair">Pareamento reservado: LG01 ↔ DB01</div></div>
  <div class="code-wrap"><div class="code-head"><h2>Página pronta</h2><div class="actions"><button class="btn" id="copy-btn">Copiar HTML completo</button><a class="btn" href="bloco-pronto.html" target="_blank" rel="noopener">HTML</a><a class="btn" href="bloco-pronto.txt" target="_blank" rel="noopener">TXT</a><a class="btn" href="../../index.html#categoria=login">Voltar ao catálogo</a></div></div><textarea id="code" spellcheck="false">Carregando código...</textarea></div>
</section>
</main>
<script>
const code=document.getElementById('code');fetch('bloco-pronto.txt').then(r=>r.text()).then(t=>code.value=t).catch(()=>code.value='Abra bloco-pronto.html para ver o código completo.');document.getElementById('copy-btn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.value);const b=document.getElementById('copy-btn');b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar HTML completo',1400)}catch{code.select();document.execCommand('copy')}});
</script>
