<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<style>
:root{--bg:#050607;--ink:#f7f3e9;--muted:#98948c;--line:rgba(255,255,255,.14);--accent:#d1ad73;--photo:url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1800&q=85');--move:1.25s;--move-ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100svh;overflow:hidden}
.lg01{position:relative;width:100%;height:100svh;min-height:680px;overflow:hidden;background:#050607;isolation:isolate}
.lg01-photo{position:absolute;z-index:1;inset:-5%;background-image:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.25)),var(--photo);background-size:cover;background-position:center;transform:translate3d(3.5%,0,0) scale(1.035);transition:transform calc(var(--move) + .08s) var(--move-ease);will-change:transform;backface-visibility:hidden}
.lg01-panel{position:absolute;z-index:4;left:0;top:0;width:50%;height:100%;background:#050607;display:flex;align-items:center;padding:clamp(34px,6vw,88px);transform:translate3d(0,0,0);transition:transform var(--move) var(--move-ease);will-change:transform;backface-visibility:hidden;box-shadow:18px 0 42px rgba(0,0,0,.12)}
.lg01-panel::before,.lg01-panel::after{content:"";position:absolute;top:0;bottom:0;width:190px;pointer-events:none;opacity:0;transition:opacity .32s ease}
.lg01-panel::after{right:-190px;background:linear-gradient(90deg,#050607 0%,rgba(5,6,7,.87) 24%,rgba(5,6,7,.47) 58%,rgba(5,6,7,0) 100%);opacity:1}
.lg01-panel::before{left:-190px;background:linear-gradient(270deg,#050607 0%,rgba(5,6,7,.87) 24%,rgba(5,6,7,.47) 58%,rgba(5,6,7,0) 100%)}
.lg01.register-side .lg01-panel{transform:translate3d(100%,0,0);box-shadow:-18px 0 42px rgba(0,0,0,.12)}
.lg01.register-side .lg01-photo{transform:translate3d(-3.5%,0,0) scale(1.035)}
.lg01.register-side .lg01-panel::after{opacity:0}
.lg01.register-side .lg01-panel::before{opacity:1}
.lg01-inner{position:relative;width:min(430px,100%);min-height:560px}
.lg01-view{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;pointer-events:none;opacity:0}
.lg01.show-login .lg01-login,.lg01.show-register .lg01-register{pointer-events:auto;opacity:1}
.lg01.is-moving .lg01-view{pointer-events:none!important}
.lg01-reveal{opacity:0;filter:blur(7px);transform:translate3d(0,28px,0);will-change:opacity,filter,transform}
.lg01.show-login .lg01-login .lg01-reveal,.lg01.show-register .lg01-register .lg01-reveal{animation:lg01-rise .72s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 72ms)}
@keyframes lg01-rise{0%{opacity:0;filter:blur(7px);transform:translate3d(0,28px,0)}55%{filter:blur(1px)}100%{opacity:1;filter:blur(0);transform:translate3d(0,0,0)}}
.lg01.is-moving .lg01-reveal{animation:none!important;opacity:0!important;filter:blur(6px)!important;transform:translate3d(0,18px,0)!important;transition:opacity .16s ease,filter .16s ease,transform .16s ease}
.lg01-kicker{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.lg01 h1{margin:0 0 12px;font:500 clamp(42px,5vw,68px)/.95 Georgia,serif;letter-spacing:-.035em}
.lg01 p{margin:0 0 30px;color:var(--muted);font-size:14px;line-height:1.65;max-width:36ch}
.lg01-form{display:grid;gap:13px}.lg01-field{display:grid;gap:7px}.lg01-field span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#aaa69e}
.lg01-input{width:100%;height:54px;border:1px solid var(--line);border-radius:13px;background:#0b0d10;color:#fff;padding:0 15px;outline:none;font-size:14px;transition:border-color .2s ease,box-shadow .2s ease}
.lg01-input:focus{border-color:rgba(209,173,115,.72);box-shadow:0 0 0 4px rgba(209,173,115,.07)}
.lg01-actions{display:grid;gap:10px;margin-top:5px}.lg01-btn{height:54px;border-radius:13px;border:1px solid var(--line);cursor:pointer;font-weight:800;font-size:13px;transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease}
.lg01-primary{border-color:transparent;background:#f1eadf;color:#08090c}.lg01-primary:hover{transform:translateY(-2px);background:#fff}.lg01-secondary{background:transparent;color:#d7d1c8}.lg01-secondary:hover{border-color:rgba(209,173,115,.55);color:var(--accent)}
.lg01-message{min-height:18px;margin-top:10px;color:#bdb7ad;font-size:12px}.lg01-message.error{color:#ffb6b6}
.lg01-note{position:absolute;left:clamp(28px,4vw,56px);bottom:30px;z-index:5;color:rgba(255,255,255,.42);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.72;transition:opacity .18s ease}.lg01.is-moving .lg01-note{opacity:0}
@media(max-width:820px){body{overflow:auto}.lg01{min-height:100svh;height:auto}.lg01-photo{inset:0;transform:none!important}.lg01-panel,.lg01.register-side .lg01-panel{position:relative;width:100%;min-height:100svh;padding:28px 22px;transform:none;box-shadow:none;background:rgba(5,6,7,.91);backdrop-filter:blur(7px)}.lg01-panel::before,.lg01-panel::after{display:none}.lg01-inner{margin:auto;min-height:620px}.lg01-note{display:none}}
@media(prefers-reduced-motion:reduce){.lg01-panel,.lg01-photo{transition:none!important}.lg01-reveal{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}}
</style>
</head>
<body>
<main class="lg01 show-login" id="lg01">
  <section class="lg01-photo" aria-hidden="true"></section>
  <section class="lg01-panel" id="lg01-panel" aria-live="polite">
    <div class="lg01-inner">
      <div class="lg01-view lg01-login">
        <div class="lg01-kicker lg01-reveal" style="--i:0">Acesso</div>
        <h1 class="lg01-reveal" style="--i:1">Bem-vindo de volta.</h1>
        <p class="lg01-reveal" style="--i:2">Entre com suas credenciais para continuar.</p>
        <form class="lg01-form" id="lg01-login-form">
          <label class="lg01-field lg01-reveal" style="--i:3"><span>E-mail</span><input class="lg01-input" name="email" type="email" autocomplete="email" required></label>
          <label class="lg01-field lg01-reveal" style="--i:4"><span>Senha</span><input class="lg01-input" name="senha" type="password" autocomplete="current-password" required></label>
          <div class="lg01-actions lg01-reveal" style="--i:5">
            <button class="lg01-btn lg01-primary" type="submit">Entrar</button>
            <button class="lg01-btn lg01-secondary" id="lg01-open-register" type="button">Criar conta</button>
          </div>
          <div class="lg01-message lg01-reveal" style="--i:6" id="lg01-login-message"></div>
        </form>
      </div>
      <div class="lg01-view lg01-register">
        <div class="lg01-kicker lg01-reveal" style="--i:0">Nova conta</div>
        <h1 class="lg01-reveal" style="--i:1">Crie seu acesso.</h1>
        <p class="lg01-reveal" style="--i:2">Preencha os dados abaixo. Depois do cadastro, a tela volta automaticamente para o login.</p>
        <form class="lg01-form" id="lg01-register-form">
          <label class="lg01-field lg01-reveal" style="--i:3"><span>Nome</span><input class="lg01-input" name="nome" type="text" autocomplete="name" required></label>
          <label class="lg01-field lg01-reveal" style="--i:4"><span>E-mail</span><input class="lg01-input" name="email" type="email" autocomplete="email" required></label>
          <label class="lg01-field lg01-reveal" style="--i:5"><span>Senha</span><input class="lg01-input" name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
          <label class="lg01-field lg01-reveal" style="--i:6"><span>Confirmar senha</span><input class="lg01-input" name="confirmarSenha" type="password" autocomplete="new-password" minlength="8" required></label>
          <div class="lg01-actions lg01-reveal" style="--i:7">
            <button class="lg01-btn lg01-primary" type="submit">Criar conta</button>
            <button class="lg01-btn lg01-secondary" id="lg01-back-login" type="button">Já tenho conta</button>
          </div>
          <div class="lg01-message lg01-reveal" style="--i:8" id="lg01-register-message"></div>
        </form>
      </div>
    </div>
  </section>
  <div class="lg01-note">LG01 · Login lateral</div>
</main>
<script>
// ===== EDITE AQUI: TELA APÓS O LOGIN =====
const DESTINO_APOS_LOGIN = 'index.html';

// ===== EDITE AQUI: ENDPOINTS DO SEU BACKEND =====
// Deixe vazio enquanto estiver apenas testando o visual.
const ENDPOINT_LOGIN = '';
const ENDPOINT_CADASTRO = '';

const MODO_DEMONSTRACAO=window.self!==window.top;
const shell=document.getElementById('lg01');
const panel=document.getElementById('lg01-panel');
const loginForm=document.getElementById('lg01-login-form');
const registerForm=document.getElementById('lg01-register-form');
const loginMessage=document.getElementById('lg01-login-message');
const registerMessage=document.getElementById('lg01-register-message');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOVE_MS=reduced?0:1250;
let trocando=false;
const esperar=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function mudarModo(destino){
  const paraCadastro=destino==='register';
  if(trocando)return;
  if(paraCadastro&&shell.classList.contains('register-side'))return;
  if(!paraCadastro&&!shell.classList.contains('register-side'))return;
  trocando=true;
  loginMessage.textContent='';
  registerMessage.textContent='';
  shell.classList.add('is-moving');
  shell.classList.remove('show-login','show-register');
  await esperar(reduced?0:190);
  shell.classList.toggle('register-side',paraCadastro);
  await esperar(MOVE_MS+40);
  shell.classList.remove('is-moving');
  shell.classList.add(paraCadastro?'show-register':'show-login');
  await esperar(reduced?0:620);
  trocando=false;
}

document.getElementById('lg01-open-register').addEventListener('click',()=>mudarModo('register'));
document.getElementById('lg01-back-login').addEventListener('click',()=>mudarModo('login'));

async function postJSON(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Não foi possível concluir.');return data}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginMessage.classList.remove('error');loginMessage.textContent='Entrando...';const payload=Object.fromEntries(new FormData(loginForm));try{if(ENDPOINT_LOGIN)await postJSON(ENDPOINT_LOGIN,payload);if(MODO_DEMONSTRACAO&&!ENDPOINT_LOGIN){loginMessage.textContent='Preview: defina o backend e o destino ao copiar o modelo.';return}location.href=DESTINO_APOS_LOGIN}catch(err){loginMessage.classList.add('error');loginMessage.textContent=err.message}});
registerForm.addEventListener('submit',async e=>{e.preventDefault();registerMessage.classList.remove('error');const payload=Object.fromEntries(new FormData(registerForm));if(payload.senha!==payload.confirmarSenha){registerMessage.classList.add('error');registerMessage.textContent='As senhas não coincidem.';return}registerMessage.textContent='Criando conta...';try{if(ENDPOINT_CADASTRO)await postJSON(ENDPOINT_CADASTRO,payload);registerForm.reset();registerMessage.textContent='Conta criada.';await esperar(650);await mudarModo('login')}catch(err){registerMessage.classList.add('error');registerMessage.textContent=err.message}});
</script>
</body>
</html>
