<!doctype html>
<html lang="pt-BR" data-catalogo-s-model="CT03"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contato</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f3f0e8;color:#111;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.ct03{min-height:100svh;padding:clamp(34px,6vw,86px);display:grid;place-items:center}.wrap{width:min(1180px,100%)}.head{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end;margin-bottom:42px}.head h1{font:600 clamp(48px,7vw,88px)/.93 Georgia,serif;margin:0}.head p{margin:0 0 8px;color:#56544f;font-size:17px;line-height:1.7}.routes{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a}.route{appearance:none;border:0;border-right:1px solid #1a1a1a;background:transparent;text-align:left;padding:26px 22px;min-height:190px;cursor:pointer;position:relative;transition:.25s}.route:last-child{border-right:0}.route .num{font-size:12px;color:#777}.route strong{display:block;font:600 24px/1.1 Georgia,serif;margin:40px 0 10px}.route span{color:#686660;font-size:13px;line-height:1.5}.route:after{content:"↗";position:absolute;right:18px;top:20px;font-size:22px}.route:hover,.route.active{background:#111;color:#f7f4ec}.route:hover span,.route.active span,.route:hover .num,.route.active .num{color:#c8c2b6}.panel{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;min-height:150px;padding:28px 0;opacity:0;transform:translateY(12px);transition:.3s}.panel.show{opacity:1;transform:none}.panel h2{font-size:24px;margin:0 0 8px}.panel p{margin:0;color:#65635e}.panel a{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-weight:800}
@media(max-width:850px){.head{grid-template-columns:1fr}.routes{grid-template-columns:1fr 1fr}.route:nth-child(2){border-right:0}.route:nth-child(-n+2){border-bottom:1px solid #1a1a1a}}@media(max-width:540px){.routes{grid-template-columns:1fr}.route{border-right:0!important;border-bottom:1px solid #1a1a1a}.route:last-child{border-bottom:0}.panel{grid-template-columns:1fr;align-items:start}}
</style></head><body><main class="ct03"><div class="wrap">
<header class="head"><h1>Como podemos ajudar?</h1><p>Em vez de jogar toda mensagem na mesma caixa de entrada, esta estrutura direciona cada pessoa para o caminho certo logo no primeiro clique.</p></header>
<section class="routes" aria-label="Tipos de contato">
<button class="route active" data-title="Falar com vendas" data-copy="Converse sobre planos, propostas, demonstrações e novos projetos." data-link="mailto:vendas@empresa.com"><span class="num">01</span><strong>Vendas</strong><span>Quero comprar ou iniciar um projeto.</span></button>
<button class="route" data-title="Suporte ao cliente" data-copy="Use este canal para dúvidas técnicas, problemas e acompanhamento." data-link="mailto:suporte@empresa.com"><span class="num">02</span><strong>Suporte</strong><span>Já sou cliente e preciso de ajuda.</span></button>
<button class="route" data-title="Parcerias" data-copy="Propostas de integração, eventos, fornecedores e colaborações." data-link="mailto:parcerias@empresa.com"><span class="num">03</span><strong>Parcerias</strong><span>Quero construir algo em conjunto.</span></button>
<button class="route" data-title="Imprensa e mídia" data-copy="Entrevistas, materiais institucionais e solicitações de imprensa." data-link="mailto:imprensa@empresa.com"><span class="num">04</span><strong>Imprensa</strong><span>Preciso falar com comunicação.</span></button>
</section>
<section class="panel show" id="ct03-panel" aria-live="polite"><div><h2>Falar com vendas</h2><p>Converse sobre planos, propostas, demonstrações e novos projetos.</p></div><a href="mailto:vendas@empresa.com">Abrir canal</a></section>
</div></main><script>
const routes=[...document.querySelectorAll('.route')],panel=document.getElementById('ct03-panel');routes.forEach(btn=>btn.addEventListener('click',()=>{routes.forEach(x=>x.classList.remove('active'));btn.classList.add('active');panel.classList.remove('show');setTimeout(()=>{panel.querySelector('h2').textContent=btn.dataset.title;panel.querySelector('p').textContent=btn.dataset.copy;panel.querySelector('a').href=btn.dataset.link;panel.classList.add('show')},120)}));
</script></body></html>
