<!doctype html>
<html lang="pt-BR" data-catalogo-s-model="CT01" data-contact-endpoint="">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07131f;color:#edf8f7}body{overflow-x:hidden}
.ct01{min-height:100svh;display:grid;place-items:center;padding:clamp(28px,5vw,72px);position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 16% 18%,rgba(23,133,130,.26),transparent 32%),radial-gradient(circle at 85% 82%,rgba(191,161,129,.18),transparent 30%),#07131f}
.ct01:before,.ct01:after{content:"";position:absolute;border-radius:50%;filter:blur(55px);opacity:.6;z-index:-1;animation:ct01float 10s ease-in-out infinite alternate}.ct01:before{width:300px;height:300px;background:#17858233;left:-80px;top:12%}.ct01:after{width:260px;height:260px;background:#bfa1812b;right:-60px;bottom:5%;animation-delay:-4s}
.wrap{width:min(1120px,100%);display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,6vw,80px);align-items:center}.copy small{display:block;text-transform:uppercase;letter-spacing:.18em;color:#78c6c3;font-weight:800;margin-bottom:18px}.copy h1{font:600 clamp(44px,7vw,84px)/.95 Georgia,serif;margin:0 0 24px}.copy p{max-width:520px;color:#b8c7cb;font-size:clamp(16px,1.7vw,19px);line-height:1.75}.quick{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.quick a{color:#effafa;text-decoration:none;border:1px solid #ffffff20;background:#ffffff0b;padding:12px 16px;border-radius:999px;backdrop-filter:blur(10px);transition:.25s}.quick a:hover{transform:translateY(-2px);border-color:#6bc3c0}
.form{padding:clamp(22px,4vw,42px);border-radius:26px;background:#ffffff0d;border:1px solid #ffffff20;box-shadow:0 26px 80px #0008;backdrop-filter:blur(20px)}.form h2{margin:0 0 8px;font-size:25px}.form .hint{margin:0 0 24px;color:#93a8ad;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#b9c8cb}.field input,.field textarea{width:100%;border:1px solid #ffffff1c;background:#07111bd9;color:#fff;border-radius:14px;padding:14px 15px;outline:none;transition:.2s}.field textarea{min-height:145px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#68c5c1;box-shadow:0 0 0 3px #17858225}.send{width:100%;margin-top:16px;border:0;border-radius:14px;background:#178582;color:#fff;padding:15px 18px;font-weight:800;cursor:pointer;transition:.25s}.send:hover{transform:translateY(-2px);box-shadow:0 12px 30px #17858245}.status{min-height:22px;margin-top:12px;color:#8ed6d3;font-size:14px}
@keyframes ct01float{to{transform:translate3d(30px,-25px,0) scale(1.08)}}@media(max-width:820px){.wrap{grid-template-columns:1fr}.copy h1{font-size:54px}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="ct01">
  <div class="wrap">
    <section class="copy" aria-labelledby="ct01-title">
      <small>Fale com a gente</small>
      <h1 id="ct01-title">Vamos conversar.</h1>
      <p>Envie uma mensagem direta e conte rapidamente o que você precisa. O formulário é inspirado no contato do portfólio Restoff e mantém feedback de envio sem recarregar a página.</p>
      <div class="quick"><a href="mailto:contato@empresa.com">E-mail</a><a href="tel:+5500000000000">Telefone</a></div>
    </section>
    <section class="form" aria-label="Formulário de contato">
      <h2>Envie uma mensagem direta</h2>
      <p class="hint">Normalmente respondemos em até um dia útil.</p>
      <form id="ct01-form">
        <div class="grid">
          <div class="field"><label for="ct01-name">Nome</label><input id="ct01-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="ct01-email">E-mail</label><input id="ct01-email" type="email" name="email" autocomplete="email" required></div>
          <div class="field full"><label for="ct01-message">Mensagem</label><textarea id="ct01-message" name="message" maxlength="800" required></textarea></div>
        </div>
        <button class="send" type="submit">Enviar mensagem</button>
        <div class="status" id="ct01-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>
</main>
<script>
const form=document.getElementById('ct01-form'),status=document.getElementById('ct01-status');
form.addEventListener('submit',async e=>{
  e.preventDefault();status.textContent='Enviando...';
  const endpoint=document.documentElement.dataset.contactEndpoint;
  if(!endpoint){await new Promise(r=>setTimeout(r,450));status.textContent='Demonstração concluída. No projeto real, defina o endpoint de envio no instalador.';return}
  try{const resp=await fetch(endpoint,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!resp.ok)throw new Error('Falha');status.textContent='Mensagem enviada com sucesso.';form.reset()}catch(_){status.textContent='Não foi possível enviar agora. Tente novamente em instantes.'}
});
</script>
</body></html>
