<style>
#efeito-a37{width:min(980px,94vw);height:min(650px,72vh);position:relative;perspective:1100px;overflow:hidden;border-radius:32px;background:#08090c}
#efeito-a37 .grid3d{position:absolute;inset:45% -20% -30%;background:linear-gradient(#6fdcff22 1px,transparent 1px),linear-gradient(90deg,#6fdcff22 1px,transparent 1px);background-size:42px 42px;transform:rotateX(68deg);transform-origin:center top}
#efeito-a37 .cards3d{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d}.d3{position:absolute;width:190px;height:250px;border-radius:22px;background:linear-gradient(145deg,#22262d,#0e1015);border:1px solid #ffffff20;display:grid;place-items:center;color:#fff;font:500 48px Georgia;box-shadow:0 28px 60px #0008;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.16,1,.3,1)}
#efeito-a37 .d1{transform:translateX(-210px) translateZ(-30px)}#efeito-a37 .d2{transform:translateZ(80px)}#efeito-a37 .d3{transform:translateX(210px) translateZ(30px)}
</style>
<div id="efeito-a37" class="scene3d"><div class="grid3d"></div><div class="cards3d"><article class="d3 d1">01</article><article class="d3 d2">02</article><article class="d3 d3">03</article></div></div>
<script>
const s=document.querySelector('#efeito-a37');s.addEventListener('pointermove',e=>{const b=s.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;s.querySelector('.cards3d').style.transform=`rotateY(${x*10}deg) rotateX(${-y*8}deg)`;s.querySelector('.grid3d').style.translate=`${x*-28}px ${y*-16}px`});
</script>
